    <path d="M0-30V-44M-15-44H15" stroke="#24293a" stroke-linecap="round" stroke-width="6" />
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">
    <g transform="translate(737 339)">
      <rect width="144" height="34" rx="17" fill="#fff" opacity=".96" />
      <circle cx="20" cy="17" r="5" fill="#18a4a7" />
